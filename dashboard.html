<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — K. Suchir Reddy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --fg: #1e293b;
      --fg-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --bg-elevated: #11141a;
        --fg: #e8eaed;
        --fg-muted: #8b919a;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --border: #242933;
        --card-bg: #151922;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; min-height: 100vh; padding: 2rem 1.5rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 700; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
    .btn:hover { background: var(--accent-hover); text-decoration: none; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--fg); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--fg-muted); }
    input, select, textarea { width: 100%; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--fg-muted); }
    .status-badge { padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--border); color: var(--fg); }
    .status-badge.applied { background: rgba(59,130,246,0.2); color: #3b82f6; }
    .status-badge.interview { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .status-badge.offer { background: rgba(16,185,129,0.2); color: #10b981; }
    .status-badge.rejected { background: rgba(239,68,68,0.2); color: #ef4444; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .stat-value { font-weight: 700; font-size: 1.1rem; }
    .task-list { list-style: none; }
    .task-list li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .task-list li:last-child { border-bottom: none; }
    .task-list input[type="checkbox"] { width: auto; cursor: pointer; }
    .task-list span.done { text-decoration: line-through; color: var(--fg-muted); }
    .delete-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 0.85rem; margin-left: auto; }
    .delete-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Applicant Dashboard</h1>
        <p style="color: var(--fg-muted); font-size: 0.9rem;">Private tracking space for K. Suchir Reddy. Data is saved to your local browser.</p>
      </div>
      <div>
        <a href="index.html" class="btn">View Public Portfolio</a>
      </div>
    </header>

    <div class="grid">
      <!-- KPIs -->
      <div class="card">
        <h2>Quick Stats</h2>
        <div class="stat-row"><span>Total Applications</span> <span class="stat-value" id="stat-total">0</span></div>
        <div class="stat-row"><span>Interviews Scheduled</span> <span class="stat-value" id="stat-interviews">0</span></div>
        <div class="stat-row"><span>Offers</span> <span class="stat-value" id="stat-offers">0</span></div>
        <div class="stat-row"><span>Rejections</span> <span class="stat-value" id="stat-rejected">0</span></div>
      </div>

      <!-- Todo List -->
      <div class="card">
        <h2>Daily Tasks</h2>
        <form id="task-form" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="task-input" placeholder="e.g. Follow up with FRND" required>
          <button type="submit" class="btn btn-sm">Add</button>
        </form>
        <ul class="task-list" id="task-list"></ul>
      </div>
    </div>

    <!-- Application Tracker -->
    <div class="card" style="grid-column: 1 / -1;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">
        <h2 style="border: none; margin: 0; padding: 0;">Application Tracker</h2>
      </div>

      <form id="app-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; background: var(--bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border);">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Company</label>
          <input type="text" id="app-company" required placeholder="e.g. 8byte">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Role</label>
          <input type="text" id="app-role" required placeholder="AI Intern">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Date Applied</label>
          <input type="date" id="app-date" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Status</label>
          <select id="app-status">
            <option value="saved">Saved / Later</option>
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div style="display: flex; align-items: flex-end;">
          <button type="submit" class="btn" style="width: 100%;">Add Record</button>
        </div>
      </form>

      <div style="overflow-x: auto;">
        <table id="app-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Company</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Data structures
    let apps = JSON.parse(localStorage.getItem('suchir_apps')) || [
      { id: Date.now(), company: 'FRND', role: 'Machine Learning Intern', date: '2026-08-27', status: 'saved' },
      { id: Date.now()+1, company: '8byte', role: 'AI Intern', date: '2026-08-27', status: 'saved' },
      { id: Date.now()+2, company: 'HARMAN India', role: 'Associate Engineer - AI/ML', date: '2026-08-27', status: 'saved' }
    ];
    let tasks = JSON.parse(localStorage.getItem('suchir_tasks')) || [
      { id: 1, text: 'Submit FRND application on LinkedIn', done: false },
      { id: 2, text: 'Submit 8byte application on LinkedIn', done: false },
      { id: 3, text: 'Submit HARMAN application on LinkedIn', done: false }
    ];

    // Initialize date field to today
    document.getElementById('app-date').valueAsDate = new Date();

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.innerHTML = `
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
          <span class="${t.done ? 'done' : ''}">${t.text}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})">Remove</button>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('suchir_tasks', JSON.stringify(tasks));
    }

    function renderApps() {
      const tbody = document.querySelector('#app-table tbody');
      tbody.innerHTML = '';

      let counts = { applied: 0, interview: 0, offer: 0, rejected: 0, total: 0 };

      apps.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(a => {
        if (a.status !== 'saved') counts.total++;
        if (counts[a.status] !== undefined) counts[a.status]++;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${a.date}</td>
          <td style="font-weight: 500;">${a.company}</td>
          <td>${a.role}</td>
          <td>
            <select onchange="updateAppStatus(${a.id}, this.value)" style="padding: 0.15rem; font-size: 0.85rem; width: auto;">
              <option value="saved" ${a.status === 'saved' ? 'selected' : ''}>Saved</option>
              <option value="applied" ${a.status === 'applied' ? 'selected' : ''}>Applied</option>
              <option value="interview" ${a.status === 'interview' ? 'selected' : ''}>Interview</option>
              <option value="offer" ${a.status === 'offer' ? 'selected' : ''}>Offer</option>
              <option value="rejected" ${a.status === 'rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
          <td><button class="delete-btn" onclick="deleteApp(${a.id})">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('stat-total').textContent = counts.total;
      document.getElementById('stat-interviews').textContent = counts.interview;
      document.getElementById('stat-offers').textContent = counts.offer;
      document.getElementById('stat-rejected').textContent = counts.rejected;

      localStorage.setItem('suchir_apps', JSON.stringify(apps));
    }

    // Task Actions
    document.getElementById('task-form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      tasks.push({ id: Date.now(), text: input.value, done: false });
      input.value = '';
      renderTasks();
    };
    window.toggleTask = (id) => {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      renderTasks();
    };
    window.deleteTask = (id) => {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    };

    // App Actions
    document.getElementById('app-form').onsubmit = (e) => {
      e.preventDefault();
      apps.push({
        id: Date.now(),
        company: document.getElementById('app-company').value,
        role: document.getElementById('app-role').value,
        date: document.getElementById('app-date').value,
        status: document.getElementById('app-status').value
      });
      document.getElementById('app-company').value = '';
      document.getElementById('app-role').value = '';
      renderApps();
    };
    window.updateAppStatus = (id, newStatus) => {
      const app = apps.find(a => a.id === id);
      if (app) app.status = newStatus;
      renderApps();
    };
    window.deleteApp = (id) => {
      if(confirm('Delete this application record?')) {
        apps = apps.filter(a => a.id !== id);
        renderApps();
      }
    };

    // Initial render
    renderTasks();
    renderApps();
  </script>
</body>
</html>
